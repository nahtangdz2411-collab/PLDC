      bindHomeEvents() {
        const root = document.getElementById("view-home");
        if (!root) return;

        const btnResume = document.getElementById("btn-resume-session");
        if (btnResume) btnResume.addEventListener("click", () => this.resumeSavedSession());

        const btnDiscard = document.getElementById("btn-discard-session");
        if (btnDiscard) {
          btnDiscard.addEventListener("click", () => {
            this.openConfirmModal({
              title: "Hủy phiên học đang dang dở?",
              bodyHtml: `<p style="margin:0; font-size:0.9rem; color:var(--text-secondary);">Tiến độ các câu chưa nộp trong phiên này sẽ bị hủy. Lịch sử thống kê và các bài thi cũ vẫn được giữ nguyên.</p>`,
              confirmLabel: "Hủy phiên",
              confirmClass: "btn-danger",
              onConfirm: () => this.discardSavedSession()
            });
          });
        }

        root.querySelectorAll("[data-mode]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.setupConfig.mode = btn.getAttribute("data-mode");
            this.savePersisted();
            this.renderHome();
          });
        });

        root.querySelectorAll("[data-chapter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const val = btn.getAttribute("data-chapter");
            if (val === "__ALL__") {
              this.setupConfig.chapters = [];
            } else {
              const idx = this.setupConfig.chapters.indexOf(val);
              if (idx >= 0) this.setupConfig.chapters.splice(idx, 1);
              else this.setupConfig.chapters.push(val);
            }
            // Clear topic if no longer in selected chapters
            const validTopics = new Set(this.getAvailableTopicsForSelectedChapters().map((t) => t.name));
            if (this.setupConfig.topic && !validTopics.has(this.setupConfig.topic)) {
              this.setupConfig.topic = "";
            }
            this.savePersisted();
            this.renderHome();
          });
        });

        const topicSearch = document.getElementById("input-topic-search");
        if (topicSearch) {
          topicSearch.addEventListener("input", (e) => {
            this.topicSearchQuery = e.target.value;
            const sel = document.getElementById("select-topic");
            if (!sel) return;
            const avail = this.getAvailableTopicsForSelectedChapters();
            const q = this.topicSearchQuery.trim().toLowerCase();
            const filtered = q ? avail.filter((t) => t.name.toLowerCase().includes(q)) : avail;
            sel.innerHTML =
              `<option value="">-- Tất cả chủ đề (${avail.length}) --</option>` +
              filtered
                .map(
                  (t) =>
                    `<option value="${escapeHtml(t.name)}" ${this.setupConfig.topic === t.name ? "selected" : ""}>${escapeHtml(t.name)} (${t.count} câu)</option>`
                )
                .join("");
          });
        }

        const selectTopic = document.getElementById("select-topic");
        if (selectTopic) {
          selectTopic.addEventListener("change", (e) => {
            this.setupConfig.topic = e.target.value;
            this.savePersisted();
            this.renderHome();
          });
        }

        root.querySelectorAll("[data-diff]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const val = btn.getAttribute("data-diff");
            if (val === "__ALL__") {
              this.setupConfig.difficulties = [];
            } else {
              const idx = this.setupConfig.difficulties.indexOf(val);
              if (idx >= 0) this.setupConfig.difficulties.splice(idx, 1);
              else this.setupConfig.difficulties.push(val);
            }
            this.savePersisted();
            this.renderHome();
          });
        });

        root.querySelectorAll("[data-special]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.setupConfig.specialFilter = btn.getAttribute("data-special");
            this.savePersisted();
            this.renderHome();
          });
        });

        root.querySelectorAll("[data-qcount]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.setupConfig.questionCount = Number(btn.getAttribute("data-qcount"));
            this.savePersisted();
            this.renderHome();
          });
        });

        const customQCount = document.getElementById("input-custom-qcount");
        if (customQCount) {
          customQCount.addEventListener("input", (e) => {
            const max = this.getFilteredQuestions().length;
            let val = parseInt(e.target.value, 10);
            if (isNaN(val) || val < 1) return;
            if (max > 0 && val > max) val = max;
            this.setupConfig.questionCount = val;
            this.savePersisted();
            const startBtn = document.getElementById("btn-start-session");
            if (startBtn && max > 0) {
              startBtn.textContent = `${this.setupConfig.mode === "exam" ? "🚀 Bắt đầu thi thử" : "📖 Bắt đầu luyện tập"} (${val} câu)`;
            }
          });
          customQCount.addEventListener("blur", (e) => {
            const max = this.getFilteredQuestions().length;
            let val = parseInt(e.target.value, 10);
            if (isNaN(val) || val < 1) val = 1;
            if (max > 0 && val > max) val = max;
            e.target.value = val;
            this.setupConfig.questionCount = val;
            this.savePersisted();
          });
        }

        root.querySelectorAll('input[name="explainTiming"]').forEach((radio) => {
          radio.addEventListener("change", (e) => {
            this.setupConfig.explainTiming = e.target.value;
            this.savePersisted();
            this.renderHome();
          });
        });

        root.querySelectorAll("[data-time]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.setupConfig.timeLimitMin = Number(btn.getAttribute("data-time"));
            this.savePersisted();
            this.renderHome();
          });
        });

        const customTime = document.getElementById("input-custom-time");
        if (customTime) {
          customTime.addEventListener("input", (e) => {
            let val = parseInt(e.target.value, 10);
            if (isNaN(val) || val < 0) return;
            if (val > 180) val = 180;
            this.setupConfig.timeLimitMin = val;
            this.savePersisted();
          });
          customTime.addEventListener("blur", (e) => {
            let val = parseInt(e.target.value, 10);
            if (isNaN(val) || val < 0) val = 0;
            if (val > 180) val = 180;
            e.target.value = val;
            this.setupConfig.timeLimitMin = val;
            this.savePersisted();
          });
        }

        const chkShuffleQ = document.getElementById("chk-shuffle-q");
        if (chkShuffleQ) {
          chkShuffleQ.addEventListener("change", (e) => {
            this.setupConfig.shuffleQuestions = e.target.checked;
            this.savePersisted();
          });
        }

        const chkShuffleOpt = document.getElementById("chk-shuffle-opt");
        if (chkShuffleOpt) {
          chkShuffleOpt.addEventListener("change", (e) => {
            this.setupConfig.shuffleOptions = e.target.checked;
            this.savePersisted();
          });
        }

        const btnResetFilters = document.getElementById("btn-reset-filters");
        if (btnResetFilters) {
          btnResetFilters.addEventListener("click", () => {
            this.setupConfig.chapters = [];
            this.setupConfig.topic = "";
            this.setupConfig.difficulties = [];
            this.setupConfig.specialFilter = "all";
            this.setupConfig.questionCount = 20;
            this.topicSearchQuery = "";
            this.savePersisted();
            this.renderHome();
          });
        }

        const btnStart = document.getElementById("btn-start-session");
        if (btnStart) {
          btnStart.addEventListener("click", () => this.startNewSession());
        }
      },

      /* ----- VIEW 2: QUIZ / EXAM SCREEN ----- */
      renderQuiz() {
        const root = document.getElementById("view-quiz");
        if (!root || !this.session) return;

        const sess = this.session;
        const total = sess.questionIds.length;
        const idx = sess.currentIndex;
        const qId = sess.questionIds[idx];
        const q = this.questionMap.get(qId);
        if (!q) return;

        const answeredCount = Object.keys(sess.answers).length;
        const flagged = Boolean(sess.flags[qId]);
        const userAnswer = sess.answers[qId] || null;
        const isImmediate = sess.mode === "practice" && sess.explainTiming === "immediate";
        const revealNow = (isImmediate && Boolean(userAnswer)) || sess.submitted;

        const diffMeta = getDifficultyMeta(q.difficulty);
        const orderedOrigKeys = sess.optionOrderMap[qId] || q.optionKeys;

        // Map original keys to display letters (A, B, C, D)
        const displayMap = orderedOrigKeys.map((origKey, i) => ({
          displayLetter: DISPLAY_LETTERS[i] || origKey,
          origKey,
          text: q.options[origKey]
        }));

        const timerText =
          sess.mode === "exam" && sess.timeLimitSeconds > 0
            ? formatDuration(Math.max(0, sess.timeLimitSeconds - (sess.elapsedSeconds || 0)))
            : formatDuration(sess.elapsedSeconds || 0);

        const progressPct = total > 0 ? Math.round((answeredCount / total) * 100) : 0;

        // Build options HTML
        const optionsHtml = displayMap
          .map((opt) => {
            const isSelected = userAnswer === opt.origKey;
            const isCorrect = opt.origKey === q.correctAnswer;
            let cls = "option-btn";
            let statusIcon = "";

            if (revealNow) {
              if (isCorrect) {
                cls += " correct";
                statusIcon = "✓";
              } else if (isSelected && !isCorrect) {
                cls += " wrong";
                statusIcon = "✕";
              }
            } else if (isSelected) {
              cls += " selected";
              statusIcon = "●";
            }

            const disabledAttr = revealNow ? "disabled" : "";

            return `
              <button type="button" class="${cls}" data-opt-key="${escapeHtml(opt.origKey)}" ${disabledAttr} aria-pressed="${isSelected ? "true" : "false"}">
                <span class="option-letter">${escapeHtml(opt.displayLetter)}</span>
                <span class="option-text">${escapeHtml(opt.text)}</span>
                ${statusIcon ? `<span class="option-status-icon" aria-hidden="true">${statusIcon}</span>` : ""}
              </button>
            `;
          })
          .join("");

        // Build explanation HTML if revealed
        const explanationHtml = revealNow ? this.buildExplanationHtml(q, userAnswer, displayMap) : "";

        root.innerHTML = `
          <div class="quiz-topbar">
            <div class="quiz-meta-left">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-save-exit">← Lưu & Thoát</button>
              <span class="badge ${sess.mode === "exam" ? "badge-warning" : "badge-primary"}">
                ${sess.mode === "exam" ? "⏱️ Thi thử" : "📘 Luyện tập"}
              </span>
            </div>
            <div class="quiz-meta-right">
              <div class="timer-pill" id="quiz-timer-pill" title="${sess.mode === "exam" && sess.timeLimitSeconds > 0 ? "Thời gian còn lại" : "Thời gian đã làm"}">
                <span aria-hidden="true">${sess.mode === "exam" && sess.timeLimitSeconds > 0 ? "⏳" : "⏱"}</span>
                <span id="quiz-timer-val">${timerText}</span>
              </div>
              <button type="button" class="btn btn-primary btn-sm" id="btn-submit-top">
                ${sess.mode === "exam" ? "Nộp bài" : "Hoàn thành"}
              </button>
            </div>
          </div>

          <div class="progress-wrap">
            <div class="progress-info">
              <span>Câu <strong>${idx + 1} / ${total}</strong></span>
              <span>Đã trả lời: <strong>${answeredCount}/${total}</strong> (${progressPct}%)</span>
            </div>
            <div class="progress-track" role="progressbar" aria-valuenow="${progressPct}" aria-valuemin="0" aria-valuemax="100">
              <div class="progress-fill" style="width:${progressPct}%"></div>
            </div>
          </div>

          <article class="question-card">
            <div class="q-badges">
              <div class="q-badge-group">
                <span class="badge badge-neutral">${escapeHtml(q.id)}</span>
                <span class="badge badge-primary">${escapeHtml(q.chapter)}</span>
                <span class="badge ${diffMeta.badgeClass}">${escapeHtml(diffMeta.label)}</span>
              </div>
              <button type="button" class="flag-btn ${flagged ? "flagged" : ""}" id="btn-flag-card">
                <span>${flagged ? "⚑ Đã đánh dấu" : "⚐ Đánh dấu xem lại"}</span>
              </button>
            </div>

            ${q.topic ? `<div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:8px;">Chủ đề: <strong>${escapeHtml(q.topic)}</strong></div>` : ""}

            <div class="q-number-row">
              <span class="q-number">Câu hỏi số ${idx + 1}</span>
            </div>

            <h2 class="q-text">${escapeHtml(q.question)}</h2>

            <div class="options-list" role="group" aria-label="Các phương án trả lời">
              ${optionsHtml}
            </div>

            ${explanationHtml}
          </article>
        `;

        // Sync bottom bar buttons
        const btnPrev = document.getElementById("btn-prev-q");
        const btnNext = document.getElementById("btn-next-q");
        const btnGrid = document.getElementById("btn-open-grid");
        const btnFlagBottom = document.getElementById("btn-flag-bottom");

        if (btnPrev) btnPrev.disabled = idx === 0;
        if (btnGrid) btnGrid.textContent = `Danh sách (${answeredCount}/${total})`;
        if (btnFlagBottom) {
          btnFlagBottom.className = flagged ? "btn btn-outline-primary" : "btn btn-secondary";
          btnFlagBottom.style.borderColor = flagged ? "var(--warning)" : "";
          btnFlagBottom.style.color = flagged ? "var(--warning)" : "";
          btnFlagBottom.style.background = flagged ? "var(--warning-bg)" : "";
          btnFlagBottom.textContent = flagged ? "⚑ Đã dấu" : "⚐ Dấu";
        }
        if (btnNext) {
          if (idx === total - 1) {
            btnNext.textContent = sess.mode === "exam" ? "Nộp bài ✓" : "Kết quả ✓";
            btnNext.className = "btn btn-success";
          } else {
            btnNext.textContent = "Tiếp →";
            btnNext.className = "btn btn-primary";
          }
        }

        this.updateTimerDisplay();

        // Bind question card events
        root.querySelectorAll("[data-opt-key]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.selectAnswer(qId, btn.getAttribute("data-opt-key"));
          });
        });

        const btnFlagCard = document.getElementById("btn-flag-card");
        if (btnFlagCard) btnFlagCard.addEventListener("click", () => this.toggleFlag(qId));

        const btnSubmitTop = document.getElementById("btn-submit-top");
        if (btnSubmitTop) btnSubmitTop.addEventListener("click", () => this.requestSubmit());

        const btnSaveExit = document.getElementById("btn-save-exit");
        if (btnSaveExit) {
          btnSaveExit.addEventListener("click", () => {
            this.pauseSessionTimer();
            showToast("Đã lưu tiến độ phiên học hiện tại.");
            this.navigateView("home");
          });
        }
      },

      buildExplanationHtml(q, userOrigKey, displayMap) {
        const correctEntry = displayMap.find((d) => d.origKey === q.correctAnswer);
        const correctDisplayLetter = correctEntry ? correctEntry.displayLetter : q.correctAnswer;
        const userEntry = userOrigKey ? displayMap.find((d) => d.origKey === userOrigKey) : null;

        let panelClass = "explanation-panel";
        let verdictClass = "exp-verdict";
        let verdictText = "";

        if (!userOrigKey) {
          verdictClass += " unanswered";
          verdictText = `Chưa trả lời • Đáp án đúng: ${correctDisplayLetter}`;
        } else if (userOrigKey === q.correctAnswer) {
          panelClass += " is-correct";
          verdictClass += " correct";
          verdictText = `✓ Chính xác! Đáp án đúng là ${correctDisplayLetter}`;
        } else {
          panelClass += " is-wrong";
          verdictClass += " wrong";
          verdictText = `✕ Chưa chính xác (Bạn chọn ${userEntry ? userEntry.displayLetter : userOrigKey}) • Đáp án đúng: ${correctDisplayLetter}`;
        }

        // Main explanation strictly from JSON
        const mainExpHtml = q.explanation
          ? `
            <div class="exp-block">
              <div class="exp-label">Giải thích đáp án đúng (${escapeHtml(correctDisplayLetter)})</div>
              <p class="exp-body">${escapeHtml(q.explanation)}</p>
            </div>
          `
          : "";

        // Wrong explanations strictly from JSON, ordered by current display letters
        const wrongItems = displayMap
          .filter((d) => d.origKey !== q.correctAnswer && q.wrongExplanations && q.wrongExplanations[d.origKey])
          .map((d) => {
            const picked = userOrigKey === d.origKey;
            return `
              <li class="wrong-exp-item ${picked ? "user-picked" : ""}">
                <strong>Phương án ${escapeHtml(d.displayLetter)}${picked ? " (Bạn đã chọn)" : ""}:</strong>
                ${escapeHtml(q.wrongExplanations[d.origKey])}
              </li>
            `;
          });

        const wrongExpHtml =
          wrongItems.length > 0
            ? `
              <div class="exp-block">
                <div class="exp-label">Phân tích các phương án sai</div>
                <ul class="wrong-exp-list">${wrongItems.join("")}</ul>
              </div>
            `
            : "";

        const sourceHtml = q.source
          ? `<div class="exp-source"><span>📚</span><span><strong>Căn cứ / Nguồn:</strong> ${escapeHtml(q.source)}</span></div>`
          : "";

        const emptyNote =
          !mainExpHtml && !wrongExpHtml && !sourceHtml
            ? `<div style="font-size:0.84rem; color:var(--text-muted); margin-top:6px;">Dữ liệu câu hỏi này không có phần giải thích chi tiết kèm theo.</div>`
            : "";

        return `
          <div class="${panelClass}">
            <div class="${verdictClass}">
              <span>${escapeHtml(verdictText)}</span>
            </div>
            ${mainExpHtml}
            ${wrongExpHtml}
            ${sourceHtml}
            ${emptyNote}
          </div>
        `;
      },

      /* ----- QUESTION NAVIGATOR MODAL ----- */
      openQuestionGridModal() {
        if (!this.session) return;
        this.renderQuestionGridModal();
      },

      renderQuestionGridModal() {
        const sess = this.session;
        if (!sess) return;

        const isImmediate = sess.mode === "practice" && sess.explainTiming === "immediate";
        const revealStatus = isImmediate || sess.submitted;
        if (!revealStatus && (this.gridFilter === "correct" || this.gridFilter === "wrong")) {
          this.gridFilter = "all";
        }

        const items = sess.questionIds.map((qId, idx) => {
          const q = this.questionMap.get(qId);
          const ans = sess.answers[qId] || null;
          const flagged = Boolean(sess.flags[qId]);
          let status = "unanswered";
          if (ans) {
            if (revealStatus && q) {
              status = ans === q.correctAnswer ? "correct" : "wrong";
            } else {
              status = "answered";
            }
          }
          return { idx, qId, status, flagged };
        });

        const counts = {
          all: items.length,
          unanswered: items.filter((i) => i.status === "unanswered").length,
          answered: items.filter((i) => i.status !== "unanswered").length,
          flagged: items.filter((i) => i.flagged).length,
          correct: items.filter((i) => i.status === "correct").length,
          wrong: items.filter((i) => i.status === "wrong").length
        };

        const filtered = items.filter((it) => {
          if (this.gridFilter === "unanswered") return it.status === "unanswered";
          if (this.gridFilter === "answered") return it.status !== "unanswered";
          if (this.gridFilter === "flagged") return it.flagged;
          if (this.gridFilter === "correct") return it.status === "correct";
          if (this.gridFilter === "wrong") return it.status === "wrong";
          return true;
        });

        const filterButtons = [
          { key: "all", label: `Tất cả (${counts.all})` },
          { key: "unanswered", label: `Chưa làm (${counts.unanswered})` },
          { key: "answered", label: `Đã trả lời (${counts.answered})` },
          { key: "flagged", label: `Đánh dấu (${counts.flagged})` }
        ];
        if (revealStatus) {
          filterButtons.push({ key: "correct", label: `Đúng (${counts.correct})` });
          filterButtons.push({ key: "wrong", label: `Sai (${counts.wrong})` });
        }

        const modalRoot = document.getElementById("modal-root");
        modalRoot.className = "modal-backdrop";
        modalRoot.innerHTML = `
          <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="grid-modal-title">
            <div class="modal-header">
              <h3 class="modal-title" id="grid-modal-title">Danh sách câu hỏi (${counts.answered}/${counts.all})</h3>
              <button type="button" class="icon-btn" id="btn-close-modal" aria-label="Đóng">✕</button>
            </div>
            <div class="modal-body">
              <div class="grid-legend">
                <span class="legend-item"><span class="legend-dot"></span> Chưa làm</span>
                ${!revealStatus ? `<span class="legend-item"><span class="legend-dot answered"></span> Đã trả lời</span>` : ""}
                ${revealStatus ? `<span class="legend-item"><span class="legend-dot correct"></span> Đúng</span>` : ""}
                ${revealStatus ? `<span class="legend-item"><span class="legend-dot wrong"></span> Sai</span>` : ""}
                <span class="legend-item"><span class="legend-dot flagged"></span> Đánh dấu xem lại</span>
              </div>

              <div class="chip-group">
                ${filterButtons
                  .map(
                    (fb) =>
                      `<button type="button" class="chip ${this.gridFilter === fb.key ? "active" : ""}" data-gfilter="${fb.key}" style="min-height:32px; font-size:0.78rem;">${fb.label}</button>`
                  )
                  .join("")}
              </div>

              ${
                filtered.length > 0
                  ? `<div class="q-grid">
                      ${filtered
                        .map((it) => {
                          const isCurrent = it.idx === sess.currentIndex;
                          const statusCls = it.status !== "unanswered" ? `status-${it.status}` : "";
                          return `
                            <button type="button" class="q-grid-cell ${statusCls} ${isCurrent ? "current" : ""}" data-jump="${it.idx}" aria-label="Chuyển tới câu ${it.idx + 1}">
                              ${it.idx + 1}
                              ${it.flagged ? `<span class="flag-dot" title="Đã đánh dấu"></span>` : ""}
                            </button>
                          `;
                        })
                        .join("")}
                    </div>`
                  : `<div class="empty-state">Không có câu hỏi nào thuộc trạng thái này.</div>`
              }
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-grid-close-foot">Đóng</button>
              <button type="button" class="btn btn-primary btn-sm" id="btn-grid-submit">
                ${sess.mode === "exam" ? "Nộp bài" : "Hoàn thành bài"}
              </button>
            </div>
          </div>
        `;

        modalRoot.onclick = (e) => {
          if (e.target === modalRoot) this.closeModal();
        };
        document.getElementById("btn-close-modal").addEventListener("click", () => this.closeModal());
        document.getElementById("btn-grid-close-foot").addEventListener("click", () => this.closeModal());
        document.getElementById("btn-grid-submit").addEventListener("click", () => {
          this.closeModal();
          this.requestSubmit();
        });

        modalRoot.querySelectorAll("[data-gfilter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.gridFilter = btn.getAttribute("data-gfilter");
            this.renderQuestionGridModal();
          });
        });

        modalRoot.querySelectorAll("[data-jump]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const targetIdx = Number(btn.getAttribute("data-jump"));
            this.closeModal();
            this.goToQuestion(targetIdx);
          });
        });
      },

      /* ----- VIEW 3: RESULT & REVIEW ----- */
      renderResult() {
        const root = document.getElementById("view-result");
        if (!root || !this.lastResult) {
          this.navigateView("home");
          return;
        }

        const { session, graded, autoSubmitted } = this.lastResult;
        const scoreRingClass = graded.score10 >= 8 ? "pass" : graded.score10 >= 5 ? "mid" : "fail";
        const wrongIds = graded.details.filter((d) => d.status !== "correct").map((d) => d.question.id);

        const filteredDetails = graded.details.filter((item) => {
          if (this.resultFilter === "wrong_and_unanswered") return item.status !== "correct";
          if (this.resultFilter === "wrong") return item.status === "wrong";
          if (this.resultFilter === "flagged") return item.flagged;
          return true;
        });

        const reviewCardsHtml =
          filteredDetails.length > 0
            ? filteredDetails
                .map((item) => {
                  const q = item.question;
                  const orderedKeys = (session.optionOrderMap && session.optionOrderMap[q.id]) || q.optionKeys;
                  const displayMap = orderedKeys.map((origKey, i) => ({
                    displayLetter: DISPLAY_LETTERS[i] || origKey,
                    origKey,
                    text: q.options[origKey]
                  }));

                  const statusBadge =
                    item.status === "correct"
                      ? `<span class="badge badge-success">✓ Đúng</span>`
                      : item.status === "wrong"
                      ? `<span class="badge badge-danger">✕ Sai</span>`
                      : `<span class="badge badge-neutral">Chưa trả lời</span>`;

                  const optsHtml = displayMap
                    .map((d) => {
                      const isCor = d.origKey === q.correctAnswer;
                      const isUser = item.userAnswer === d.origKey;
                      let cls = "review-opt";
                      if (isCor) cls += " is-correct";
                      else if (isUser) cls += " is-user-wrong";

                      return `
                        <div class="${cls}">
                          <strong>${escapeHtml(d.displayLetter)}.</strong>
                          <span style="flex:1;">${escapeHtml(d.text)}</span>
                          ${isCor ? `<span style="color:var(--success); font-weight:700;">✓ Đúng</span>` : ""}
                          ${isUser && !isCor ? `<span style="color:var(--danger); font-weight:700;">✕ Bạn chọn</span>` : ""}
                        </div>
                      `;
                    })
                    .join("");

                  const expHtml = this.buildExplanationHtml(q, item.userAnswer, displayMap);

                  return `
                    <div class="review-card is-${item.status}">
                      <div class="q-badges" style="margin-bottom:8px;">
                        <div class="q-badge-group">
                          <span class="badge badge-neutral">Câu ${item.index + 1} (${escapeHtml(q.id)})</span>
                          <span class="badge badge-primary">${escapeHtml(q.chapter)}</span>
                          ${statusBadge}
                          ${item.flagged ? `<span class="badge badge-warning">⚑ Đánh dấu</span>` : ""}
                        </div>
                      </div>
                      <div style="font-weight:600; margin-bottom:10px; font-size:0.96rem;">${escapeHtml(q.question)}</div>
                      <div>${optsHtml}</div>
                      ${expHtml}
                    </div>
                  `;
                })
                .join("")
            : `<div class="card"><div class="empty-state">Không có câu hỏi nào trong mục lọc này.</div></div>`;

        root.innerHTML = `
          <div class="score-hero">
            <div class="badge ${session.mode === "exam" ? "badge-warning" : "badge-primary"}" style="margin-bottom:10px;">
              ${session.mode === "exam" ? "Kết quả Thi thử" : "Kết quả Luyện tập"} ${autoSubmitted ? "• Tự động nộp khi hết giờ" : ""}
            </div>
            <div class="score-ring ${scoreRingClass}">
              <span class="score-value">${graded.score10.toFixed(2)}</span>
              <span class="score-unit">THANG 10</span>
            </div>
            <div style="font-weight:700; font-size:1.02rem; margin-bottom:4px;">${escapeHtml(session.scopeLabel)}</div>
            <div style="font-size:0.86rem; color:var(--text-muted); margin-bottom:16px;">
              Độ chính xác: <strong>${graded.accuracy}%</strong> • Thời gian hoàn thành: <strong>${formatDuration(graded.durationSec)}</strong>
            </div>
            <div class="inline-row" style="justify-content:center;">
              ${
                wrongIds.length > 0
                  ? `<button type="button" class="btn btn-primary btn-sm" id="btn-retry-wrong">🔁 Ôn lại ${wrongIds.length} câu sai / bỏ trống</button>`
                  : ""
              }
              <button type="button" class="btn btn-outline-primary btn-sm" id="btn-new-same-mode">Làm lượt mới</button>
              <button type="button" class="btn btn-secondary btn-sm" id="btn-result-home">Về trang chủ</button>
            </div>
          </div>

          <div class="metrics-grid">
            <div class="metric-box">
              <span class="metric-label">Tổng số câu</span>
              <span class="metric-val">${graded.total}</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Số câu đúng</span>
              <span class="metric-val success">${graded.correct}</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Số câu sai</span>
              <span class="metric-val danger">${graded.wrong}</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Chưa trả lời</span>
              <span class="metric-val warning">${graded.unanswered}</span>
            </div>
          </div>

          <div class="card">
            <div class="card-header" style="flex-wrap:wrap;">
              <div>
                <h2 class="card-title">Xem lại đáp án & giải thích chi tiết</h2>
                <p class="card-subtitle">Đối chiếu phương án đúng, phân tích đáp án sai và căn cứ pháp lý.</p>
              </div>
            </div>
            <div class="chip-group" style="margin-bottom:14px;">
              <button type="button" class="chip ${this.resultFilter === "wrong_and_unanswered" ? "active" : ""}" data-rfilter="wrong_and_unanswered">
                Sai & chưa làm (${graded.wrong + graded.unanswered})
              </button>
              <button type="button" class="chip ${this.resultFilter === "wrong" ? "active" : ""}" data-rfilter="wrong">
                Chỉ câu sai (${graded.wrong})
              </button>
              <button type="button" class="chip ${this.resultFilter === "flagged" ? "active" : ""}" data-rfilter="flagged">
                Đánh dấu (${graded.details.filter((d) => d.flagged).length})
              </button>
              <button type="button" class="chip ${this.resultFilter === "all" ? "active" : ""}" data-rfilter="all">
                Tất cả (${graded.total})
              </button>
            </div>
            ${reviewCardsHtml}
          </div>
        `;

        const btnRetryWrong = document.getElementById("btn-retry-wrong");
        if (btnRetryWrong) {
          btnRetryWrong.addEventListener("click", () => {
            this.startNewSession(wrongIds, { mode: "practice", explainTiming: "immediate" });
          });
        }

        const btnNewSame = document.getElementById("btn-new-same-mode");
        if (btnNewSame) {
          btnNewSame.addEventListener("click", () => this.startNewSession());
        }

        const btnResultHome = document.getElementById("btn-result-home");
        if (btnResultHome) {
          btnResultHome.addEventListener("click", () => this.navigateView("home"));
        }

        root.querySelectorAll("[data-rfilter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            this.resultFilter = btn.getAttribute("data-rfilter");
            this.renderResult();
          });
        });
      },

      /* ----- VIEW 4: STATISTICS ----- */
      renderStats() {
        const root = document.getElementById("view-stats");
        if (!root) return;

        const stats = ScoringEngine.computeOverallStats(this.questions, this.persisted);
        const examOnlyHistory = stats.examHistory.filter((h) => h.mode === "exam");
        const allHistory = stats.examHistory;

        // Weak chapters callout
        const weakHtml =
          stats.weakChapters.length > 0
            ? `
              <div class="card">
                <div class="card-header">
                  <div>
                    <h2 class="card-title">Các chương có tỷ lệ sai cao cần ôn tập</h2>
                    <p class="card-subtitle">Sắp xếp theo tỷ lệ trả lời sai thực tế từ cao xuống thấp.</p>
                  </div>
                </div>
                ${stats.weakChapters
                  .map(
                    (c) => `
                      <div class="chapter-stat-row">
                        <div class="chapter-stat-top">
                          <span class="chapter-stat-name">${escapeHtml(c.chapter)}</span>
                          <div class="inline-row">
                            <span class="badge badge-danger">Sai ${c.wrongRate}% (${c.wrongAttempts}/${c.totalAttempts} lượt)</span>
                            <button type="button" class="btn btn-outline-primary btn-sm" data-practice-chapter="${escapeHtml(c.chapter)}">Ôn chương này</button>
                          </div>
                        </div>
                      </div>
                    `
                  )
                  .join("")}
              </div>
            `
            : "";

        // Chapter progress rows
        const chapterRowsHtml = stats.chapters
          .map((c) => {
            const corPct = c.totalAttempts > 0 ? (c.correctAttempts / c.totalAttempts) * 100 : 0;
            const wrgPct = c.totalAttempts > 0 ? (c.wrongAttempts / c.totalAttempts) * 100 : 0;
            return `
              <div class="chapter-stat-row">
                <div class="chapter-stat-top">
                  <span class="chapter-stat-name">${escapeHtml(c.chapter)}</span>
                  <div class="chapter-stat-nums">
                    <span>Đã phủ: <strong>${c.attemptedQuestions}/${c.totalQuestions}</strong> câu (${c.coverage}%)</span>
                    <span style="color:var(--success);">Đúng: <strong>${c.correctAttempts}</strong></span>
                    <span style="color:var(--danger);">Sai: <strong>${c.wrongAttempts}</strong></span>
                    <span>Chính xác: <strong>${c.totalAttempts > 0 ? c.accuracy + "%" : "—"}</strong></span>
                  </div>
                </div>
                <div class="bar-dual" title="Tỷ lệ đúng / sai của ${escapeHtml(c.chapter)}">
                  <div class="bar-correct" style="width:${corPct}%"></div>
                  <div class="bar-wrong" style="width:${wrgPct}%"></div>
                </div>
              </div>
            `;
          })
          .join("");

        // History table
        const buildHistoryTable = (list, emptyMsg) => {
          if (list.length === 0) {
            return `<div class="empty-state">${emptyMsg}</div>`;
          }
          return `
            <div class="history-table-wrap">
              <table class="history-table">
                <thead>
                  <tr>
                    <th>Thời gian</th>
                    <th>Chế độ</th>
                    <th>Phạm vi</th>
                    <th>Điểm / 10</th>
                    <th>Đúng / Sai / Bỏ</th>
                    <th>Chính xác</th>
                    <th>Thời lượng</th>
                  </tr>
                </thead>
                <tbody>
                  ${list
                    .map(
                      (h) => `
                        <tr>
                          <td>${escapeHtml(formatDateTime(h.completedAt))}</td>
                          <td><span class="badge ${h.mode === "exam" ? "badge-warning" : "badge-primary"}">${h.mode === "exam" ? "Thi thử" : "Luyện tập"}</span></td>
                          <td>${escapeHtml(h.scopeLabel || "Toàn bộ")}</td>
                          <td><strong>${Number(h.score10 || 0).toFixed(2)}</strong></td>
                          <td>
                            <span style="color:var(--success); font-weight:700;">${h.correct}</span> /
                            <span style="color:var(--danger); font-weight:700;">${h.wrong}</span> /
                            <span style="color:var(--text-muted);">${h.unanswered}</span>
                          </td>
                          <td>${Number(h.accuracy || 0).toFixed(1)}%</td>
                          <td>${formatDuration(h.durationSec)}</td>
                        </tr>
                      `
                    )
                    .join("")}
                </tbody>
              </table>
            </div>
          `;
        };

        root.innerHTML = `
          <div class="metrics-grid">
            <div class="metric-box">
              <span class="metric-label">Số câu đã làm (duy nhất)</span>
              <span class="metric-val primary">${stats.uniqueAttempted}/${stats.bankTotal}</span>
              <span style="font-size:0.75rem; color:var(--text-muted);">${stats.totalAttempts} lượt trả lời</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Tổng lượt đúng</span>
              <span class="metric-val success">${stats.totalCorrectAttempts}</span>
              <span style="font-size:0.75rem; color:var(--text-muted);">Lần gần nhất đúng: ${stats.uniqueLastCorrect} câu</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Tổng lượt sai</span>
              <span class="metric-val danger">${stats.totalWrongAttempts}</span>
              <span style="font-size:0.75rem; color:var(--text-muted);">Lần gần nhất sai: ${stats.uniqueLastWrong} câu</span>
            </div>
            <div class="metric-box">
              <span class="metric-label">Tỷ lệ chính xác</span>
              <span class="metric-val">${stats.totalAttempts > 0 ? stats.accuracy + "%" : "—"}</span>
              <span style="font-size:0.75rem; color:var(--text-muted);">Đánh dấu xem lại: ${stats.flaggedCount} câu</span>
            </div>
          </div>

          ${weakHtml}

          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">Tiến độ theo từng chương</h2>
                <p class="card-subtitle">Số liệu tổng hợp trực tiếp từ các lượt trả lời của bạn.</p>
              </div>
            </div>
            ${chapterRowsHtml || `<div class="empty-state">Chưa có dữ liệu chương.</div>`}
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">Lịch sử các lần thi thử (${examOnlyHistory.length})</h2>
                <p class="card-subtitle">Lưu tự động điểm số, độ chính xác và thời gian hoàn thành mỗi lần thi thử.</p>
              </div>
            </div>
            ${buildHistoryTable(examOnlyHistory, "Bạn chưa hoàn thành bài thi thử nào. Hãy chuyển sang tab Ôn tập → chọn chế độ Thi thử để bắt đầu.")}
          </div>

          ${
            allHistory.length > examOnlyHistory.length
              ? `
                <div class="card">
                  <div class="card-header">
                    <div>
                      <h2 class="card-title">Toàn bộ lịch sử phiên học (${allHistory.length})</h2>
                      <p class="card-subtitle">Bao gồm cả các phiên luyện tập đã hoàn thành và bài thi thử.</p>
                    </div>
                  </div>
                  ${buildHistoryTable(allHistory, "Chưa có lịch sử học tập.")}
                </div>
              `
              : ""
          }
        `;

        root.querySelectorAll("[data-practice-chapter]").forEach((btn) => {
          btn.addEventListener("click", () => {
            const ch = btn.getAttribute("data-practice-chapter");
            this.setupConfig.mode = "practice";
            this.setupConfig.chapters = [ch];
            this.setupConfig.topic = "";
            this.setupConfig.difficulties = [];
            this.setupConfig.specialFilter = "all";
            this.setupConfig.questionCount = 0;
            this.savePersisted();
            this.startNewSession();
          });
        });
      },

      /* ----- VIEW 5: DATA & SETTINGS ----- */
      renderSettings() {
        const root = document.getElementById("view-settings");
        if (!root) return;

        const stats = ScoringEngine.computeOverallStats(this.questions, this.persisted);
        const importedTime = this.bankSourceInfo.importedAt ? ` (Nhập lúc ${formatDateTime(this.bankSourceInfo.importedAt)})` : "";

        root.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">Ngân hàng câu hỏi hiện tại</h2>
                <p class="card-subtitle">Cập nhật trực tiếp file JSON mới mà không cần sửa mã nguồn.</p>
              </div>
            </div>

            <div class="summary-strip" style="margin-bottom:14px;">
              <div>
                <div style="font-weight:700; font-size:0.92rem;">${escapeHtml(this.bankSourceInfo.fileName)}${escapeHtml(importedTime)}</div>
                <div style="font-size:0.82rem; color:var(--text-muted); margin-top:2px;">
                  ${this.questions.length} câu hỏi hợp lệ • ${this.metadata.chapters.length} chương • ${this.metadata.topics.length} chủ đề
                </div>
              </div>
              <span class="badge ${this.bankSourceInfo.isCustom ? "badge-warning" : "badge-success"}">
                ${this.bankSourceInfo.isCustom ? "File JSON tùy chỉnh" : "Ngân hàng mặc định"}
              </span>
            </div>

            <div class="inline-row">
              <label class="btn btn-primary btn-sm" for="input-json-file">
                📂 Nhập file JSON mới
              </label>
              <input type="file" id="input-json-file" accept=".json,application/json" class="sr-only">
              ${
                this.bankSourceInfo.isCustom
                  ? `<button type="button" class="btn btn-secondary btn-sm" id="btn-restore-default-bank">Khôi phục ngân hàng mặc định</button>`
                  : ""
              }
            </div>
            <div id="import-feedback" style="margin-top:10px; font-size:0.84rem;"></div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">Quản lý dữ liệu học tập (localStorage)</h2>
                <p class="card-subtitle">Toàn bộ tiến độ, câu đánh dấu và lịch sử thi thử được lưu cục bộ trên trình duyệt này.</p>
              </div>
            </div>

            <div style="font-size:0.88rem; color:var(--text-secondary); margin-bottom:14px;">
              Hiện đang lưu: <strong>${stats.uniqueAttempted}</strong> câu đã làm, <strong>${stats.flaggedCount}</strong> câu đánh dấu xem lại, <strong>${stats.examHistory.length}</strong> lượt hoàn thành.
            </div>

            <div class="inline-row">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-export-progress">⬇️ Sao lưu tiến độ (JSON)</button>
              <button type="button" class="btn btn-danger-soft btn-sm" id="btn-clear-progress">🗑️ Xóa toàn bộ dữ liệu học tập</button>
            </div>
          </div>

          <div class="card">
            <div class="card-header">
              <div>
                <h2 class="card-title">Phím tắt hỗ trợ trên máy tính</h2>
              </div>
            </div>
            <div style="font-size:0.86rem; color:var(--text-secondary); display:grid; grid-template-columns:repeat(auto-fit, minmax(210px, 1fr)); gap:8px;">
              <div><strong>A / B / C / D</strong> hoặc <strong>1–4</strong>: Chọn đáp án</div>
              <div><strong>← / →</strong>: Chuyển câu trước / tiếp</div>
              <div><strong>F</strong>: Đánh dấu / bỏ đánh dấu câu</div>
              <div><strong>G</strong>: Mở / đóng danh sách câu hỏi</div>
            </div>
          </div>
        `;

        const fileInput = document.getElementById("input-json-file");
        if (fileInput) {
          fileInput.addEventListener("change", (e) => this.handleImportJsonFile(e));
        }

        const btnRestore = document.getElementById("btn-restore-default-bank");
        if (btnRestore) {
          btnRestore.addEventListener("click", () => {
            this.openConfirmModal({
              title: "Khôi phục ngân hàng câu hỏi mặc định?",
              bodyHtml: `<p style="margin:0; font-size:0.9rem; color:var(--text-secondary);">Ứng dụng sẽ quay lại bộ 100 câu hỏi Pháp luật đại cương tích hợp sẵn.</p>`,
              confirmLabel: "Khôi phục",
              confirmClass: "btn-primary",
              onConfirm: () => {
                StorageService.clearCustomBank();
                const embedded = DataValidator.parseEmbeddedJSON();
                if (embedded.ok) {
                  this.loadValidQuestions(embedded.questions);
                  this.bankSourceInfo = {
                    isCustom: false,
                    fileName: "phap_luat_dai_cuong_100_cau.json (tích hợp sẵn)",
                    importedAt: null
                  };
                  this.persisted.activeSession = null;
                  this.sanitizeSetupConfig();
                  this.savePersisted();
                  showToast("Đã khôi phục ngân hàng mặc định.");
                  this.renderSettings();
                }
              }
            });
          });
        }

        const btnExport = document.getElementById("btn-export-progress");
        if (btnExport) {
          btnExport.addEventListener("click", () => this.exportProgressBackup());
        }

        const btnClear = document.getElementById("btn-clear-progress");
        if (btnClear) {
          btnClear.addEventListener("click", () => {
            this.openConfirmModal({
              title: "Xóa toàn bộ dữ liệu học tập?",
              bodyHtml: `<p style="margin:0; font-size:0.9rem; color:var(--text-secondary);">Hành động này sẽ xóa vĩnh viễn toàn bộ tiến độ câu hỏi, câu đánh dấu xem lại, phiên đang làm dở và lịch sử các lần thi thử trên trình duyệt này. Ngân hàng câu hỏi vẫn được giữ nguyên.</p>`,
              confirmLabel: "Xóa dữ liệu",
              confirmClass: "btn-danger",
              onConfirm: () => {
                this.pauseSessionTimer();
                this.session = null;
                this.lastResult = null;
                this.persisted.activeSession = null;
                this.persisted.questionProgress = {};
                this.persisted.flaggedIds = [];
                this.persisted.examHistory = [];
                this.savePersisted();
                showToast("Đã xóa toàn bộ dữ liệu học tập.");
                this.renderSettings();
              }
            });
          });
        }
      },

      handleImportJsonFile(event) {
        const file = event.target.files && event.target.files[0];
        const feedback = document.getElementById("import-feedback");
        if (!file) return;

        const reader = new FileReader();
        reader.onload = () => {
          try {
            const parsed = JSON.parse(String(reader.result || ""));
            const check = DataValidator.validateBank(parsed);
            if (!check.ok) {
              if (feedback) {
                feedback.innerHTML = `<div class="alert alert-danger" style="margin:0;">${escapeHtml(check.error)}</div>`;
              }
              return;
            }

            const saved = StorageService.saveCustomBank(file.name, check.questions);
            this.loadValidQuestions(check.questions);
            this.bankSourceInfo = {
              isCustom: true,
              fileName: file.name,
              importedAt: Date.now()
            };
            this.persisted.activeSession = null;
            this.sanitizeSetupConfig();
            this.savePersisted();

            let msg = `Đã nhập thành công ${check.questions.length} câu hỏi từ "${file.name}".`;
            if (!saved) msg += " (Lưu ý: trình duyệt không cho lưu lâu dài vào localStorage).";
            if (check.warnings.length > 0) {
              msg += ` Có ${check.warnings.length} mục không hợp lệ đã được bỏ qua.`;
            }
            showToast(`Đã cập nhật ${check.questions.length} câu hỏi mới!`);
            this.renderSettings();
            const fbAfter = document.getElementById("import-feedback");
            if (fbAfter) {
              fbAfter.innerHTML = `<div class="alert alert-primary" style="margin:0; color:var(--primary);">${escapeHtml(msg)}</div>`;
            }
          } catch (err) {
            if (feedback) {
              feedback.innerHTML = `<div class="alert alert-danger" style="margin:0;">File JSON bị lỗi cú pháp: ${escapeHtml(err.message)}</div>`;
            }
          }
        };
        reader.onerror = () => {
          if (feedback) {
            feedback.innerHTML = `<div class="alert alert-danger" style="margin:0;">Không thể đọc file đã chọn.</div>`;
          }
        };
        reader.readAsText(file, "utf-8");
      },

      exportProgressBackup() {
        try {
          const payload = {
            exportedAt: new Date().toISOString(),
            questionProgress: this.persisted.questionProgress,
            flaggedIds: this.persisted.flaggedIds,
            examHistory: this.persisted.examHistory
          };
          const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
          const url = URL.createObjectURL(blob);
          const a = document.createElement("a");
          a.href = url;
          a.download = "tien_do_phap_luat_dai_cuong.json";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
          showToast("Đã tải xuống file sao lưu tiến độ.");
        } catch (e) {
          showToast("Trình duyệt không hỗ trợ tải xuống trực tiếp.");
        }
      },

      /* ----- GENERIC CONFIRMATION MODAL ----- */
      openConfirmModal({ title, bodyHtml, confirmLabel, confirmClass, onConfirm }) {
        const modalRoot = document.getElementById("modal-root");
        modalRoot.className = "modal-backdrop";
        modalRoot.innerHTML = `
          <div class="modal-panel" style="max-width:460px;" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
            <div class="modal-header">
              <h3 class="modal-title" id="confirm-modal-title">${escapeHtml(title)}</h3>
              <button type="button" class="icon-btn" id="btn-confirm-x" aria-label="Đóng">✕</button>
            </div>
            <div class="modal-body">${bodyHtml}</div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary btn-sm" id="btn-confirm-cancel">Hủy</button>
              <button type="button" class="btn ${confirmClass || "btn-primary"} btn-sm" id="btn-confirm-ok">${escapeHtml(confirmLabel || "Xác nhận")}</button>
            </div>
          </div>
        `;

        const close = () => this.closeModal();
        modalRoot.onclick = (e) => {
          if (e.target === modalRoot) close();
        };
        document.getElementById("btn-confirm-x").addEventListener("click", close);
        document.getElementById("btn-confirm-cancel").addEventListener("click", close);
        document.getElementById("btn-confirm-ok").addEventListener("click", () => {
          close();
          if (typeof onConfirm === "function") onConfirm();
        });
      },

      closeModal() {
        const modalRoot = document.getElementById("modal-root");
        if (!modalRoot) return;
        modalRoot.className = "hidden";
        modalRoot.innerHTML = "";
        modalRoot.onclick = null;
      },

      /* =========================================================================
         7. GLOBAL EVENTS & KEYBOARD SHORTCUTS
         ========================================================================= */
      bindGlobalEvents() {
        document.getElementById("btn-theme-toggle").addEventListener("click", () => this.toggleTheme());

        document.getElementById("btn-brand-home").addEventListener("click", () => {
          this.navigateView("home");
        });

        document.querySelectorAll(".nav-tab").forEach((tab) => {
          tab.addEventListener("click", () => {
            const view = tab.getAttribute("data-view");
            this.navigateView(view);
          });
        });

        // Bottom quiz navigation bar
        document.getElementById("btn-prev-q").addEventListener("click", () => {
          if (this.session) this.goToQuestion(this.session.currentIndex - 1);
        });

        document.getElementById("btn-next-q").addEventListener("click", () => {
          if (!this.session) return;
          if (this.session.currentIndex >= this.session.questionIds.length - 1) {
            this.requestSubmit();
          } else {
            this.goToQuestion(this.session.currentIndex + 1);
          }
        });

        document.getElementById("btn-open-grid").addEventListener("click", () => {
          this.openQuestionGridModal();
        });

        document.getElementById("btn-flag-bottom").addEventListener("click", () => {
          if (!this.session) return;
          const qId = this.session.questionIds[this.session.currentIndex];
          if (qId) this.toggleFlag(qId);
        });

        // Keyboard shortcuts for Desktop Chrome
        document.addEventListener("keydown", (e) => {
          const tag = (e.target && e.target.tagName) || "";
          if (tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;

          const modalOpen = !document.getElementById("modal-root").classList.contains("hidden");
          if (e.key === "Escape" && modalOpen) {
            this.closeModal();
            return;
          }

          if (this.currentView !== "quiz" || !this.session) return;

          if (e.key.toLowerCase() === "g") {
            e.preventDefault();
            if (modalOpen) this.closeModal();
            else this.openQuestionGridModal();
            return;
          }

          if (modalOpen) return;

          if (e.key === "ArrowLeft") {
            e.preventDefault();
            this.goToQuestion(this.session.currentIndex - 1);
          } else if (e.key === "ArrowRight") {
            e.preventDefault();
            if (this.session.currentIndex < this.session.questionIds.length - 1) {
              this.goToQuestion(this.session.currentIndex + 1);
            }
          } else if (e.key.toLowerCase() === "f") {
            e.preventDefault();
            const qId = this.session.questionIds[this.session.currentIndex];
            if (qId) this.toggleFlag(qId);
          } else {
            const upper = e.key.toUpperCase();
            let optIdx = DISPLAY_LETTERS.indexOf(upper);
            if (optIdx === -1 && ["1", "2", "3", "4"].includes(e.key)) {
              optIdx = Number(e.key) - 1;
            }
            if (optIdx >= 0) {
              const qId = this.session.questionIds[this.session.currentIndex];
              const q = this.questionMap.get(qId);
              const ordered = (this.session.optionOrderMap && this.session.optionOrderMap[qId]) || (q ? q.optionKeys : []);
              if (ordered[optIdx]) {
                this.selectAnswer(qId, ordered[optIdx]);
              }
            }
          }
        });

        // Save state safely when leaving / backgrounding page (crucial for iOS Safari)
        window.addEventListener("pagehide", () => {
          if (this.session && !this.session.submitted) {
            this.savePersisted();
          }
        });

        document.addEventListener("visibilitychange", () => {
          if (document.visibilityState === "hidden" && this.session && !this.session.submitted) {
            this.savePersisted();
          } else if (document.visibilityState === "visible" && this.currentView === "quiz" && this.session && !this.session.submitted) {
            this.session.lastTickAt = Date.now();
          }
        });
      }
    };

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", () => App.init());
    } else {
      App.init();
    }
  })();
  </script>
</body>
